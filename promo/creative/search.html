<!-- Search-result asset: the site's headline over its deviation scale, which runs the full width
     and reads zero, among the guidance that gets there: speed, the run-in and the pass report. -->
<div class="scale">
  <div class="scale-track"><span class="scale-index"></span><span class="scale-needle"></span></div>
  <div class="scale-legend label">
    <span style="left: 12.5%">−15</span><span style="left: 25%">−10</span>
    <span style="left: 37.5%">−5</span><span class="zero" style="left: 50%">0</span>
    <span style="left: 62.5%">+5</span><span style="left: 75%">+10</span>
    <span style="left: 87.5%">+15</span>
  </div>
</div>
<div class="copy">
  <p class="label" data-copy="creative-label"></p>
  <h1 class="headline" data-copy="creative-headline"></h1>
</div>
<p class="readout"><span class="label" data-copy="creative-scale"></span><span class="value">00.0 s</span></p>
<div class="card run-in"><img data-still="run-in" alt="" /></div>
<div class="card speed"><img data-still="speed-guidance" alt="" /></div>
<div class="card pass"><img data-still="past-target" alt="" /></div>
