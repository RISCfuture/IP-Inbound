name: Release

# Pushing a version tag builds the release and finishes it: the app is archived and uploaded to App
# Store Connect, the version's release notes are written from CHANGELOG.md, and the build is
# attached to the version once Apple has processed it. Submitting for review is the only step left
# by hand.
#
# Re-tagging a version is how its build is replaced. The tag push runs all of this again and the
# version ends up pointing at the newer build; the older one stays on App Store Connect, since a
# build can be expired but never deleted. A tag push is a deploy, not bookkeeping.
#
# Nothing here re-runs the test suites: tag a commit CI has already passed. The one test it does
# run is CloudKitSchemaTests, strictly, after checking Production still matches
# CloudKit/schema.ckdb: a model that schema doesn't cover would never sync from the build being
# shipped. See CloudKit/README.md.
on:
  push:
    tags: ["[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version to build and upload.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  cloudkit:
    uses: RISCfuture/XCUITestKit/.github/workflows/cloudkit-schema.yml@1.1.0
    with:
      runner: xcode-27
      ruby-version: "4.0.9"
      team-id: 2NFSK2WB24
      container-id: iCloud.codes.tim.IP-Inbound
      certificates-repo: RISCfuture/certificates
      scheme: IP Inbound
      destination: platform=iOS Simulator,name=iPhone 17 Pro
      only-testing: IP InboundTests/CloudKitSchemaTests
    secrets:
      certificates-token: ${{ secrets.CERTIFICATES_TOKEN }}
      match-password: ${{ secrets.MATCH_PASSWORD }}

  release:
    needs: cloudkit
    uses: RISCfuture/XCUITestKit/.github/workflows/ios-release.yml@1.0.0
    with:
      # The watch app and the Live Activity extension are embedded in the iOS archive.
      platforms: '["iOS"]'
      # Required upstream, with no default: the runner image is each app's own decision.
      runner: xcode-27
      # Named explicitly so the release bundler matches the Ruby .ruby-version pins;
      # upstream would otherwise install its own default.
      ruby-version: "4.0.9"
      version: ${{ inputs.version || github.ref_name }}
      certificates-repo: RISCfuture/certificates
      verify-lane: ci_verify_release_notes
      finish-lane: ci_finish_release
    secrets:
      certificates-token: ${{ secrets.CERTIFICATES_TOKEN }}
      match-password: ${{ secrets.MATCH_PASSWORD }}
      sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
